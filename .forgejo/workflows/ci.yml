name: ci

on:
  push:
  pull_request:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  # Linux. WPF cannot be built on Linux, so this job never touches the .sln — building the
  # solution would pull in CspPaletteCompanion.App (net8.0-windows, UseWPF) and fail.
  # Every project below was checked to be plain net8.0 with no Windows-only reference.
  # Covered here:      Core, Companion, their test projects, SmokeFixture
  # Left to `windows`: CspPaletteCompanion.App, CspPaletteCompanion.App.Tests
  libraries:
    runs-on: ubuntu-latest
    # The .NET 8 SDK comes from the container, so no setup-dotnet action is needed.
    # If this instance's Linux runner registers a different label, change `runs-on` only.
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      # Checked out with git rather than an action on purpose. Every Forgejo/GitHub
      # checkout action is a node20 JavaScript action, and this image ships no Node.js,
      # so `uses:` cannot execute here at all. The image does ship git. This also leaves
      # the workflow with zero external action dependencies, which is the safer default
      # against a self-hosted instance whose action registry we do not control.
      - name: Checkout
        run: |
          git init -q .
          git config --global --add safe.directory "$PWD"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: token ${GITHUB_TOKEN}" \
              fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Restore
        run: |
          dotnet restore src/CspPaletteCompanion.Core/CspPaletteCompanion.Core.csproj
          dotnet restore src/CspPaletteCompanion.Companion/CspPaletteCompanion.Companion.csproj
          dotnet restore tests/CspPaletteCompanion.Core.Tests/CspPaletteCompanion.Core.Tests.csproj
          dotnet restore tests/CspPaletteCompanion.Companion.Tests/CspPaletteCompanion.Companion.Tests.csproj
          dotnet restore tools/CspPaletteCompanion.SmokeFixture/CspPaletteCompanion.SmokeFixture.csproj

      - name: Build
        run: |
          dotnet build src/CspPaletteCompanion.Core/CspPaletteCompanion.Core.csproj -c Release --no-restore
          dotnet build src/CspPaletteCompanion.Companion/CspPaletteCompanion.Companion.csproj -c Release --no-restore
          dotnet build tests/CspPaletteCompanion.Core.Tests/CspPaletteCompanion.Core.Tests.csproj -c Release --no-restore
          dotnet build tests/CspPaletteCompanion.Companion.Tests/CspPaletteCompanion.Companion.Tests.csproj -c Release --no-restore
          dotnet build tools/CspPaletteCompanion.SmokeFixture/CspPaletteCompanion.SmokeFixture.csproj -c Release --no-restore

      - name: Test
        run: |
          dotnet test tests/CspPaletteCompanion.Core.Tests/CspPaletteCompanion.Core.Tests.csproj -c Release --no-build
          dotnet test tests/CspPaletteCompanion.Companion.Tests/CspPaletteCompanion.Companion.Tests.csproj -c Release --no-build

  windows:
    # Authoritative product validation. The Windows runner can compile WPF and
    # execute the App test project, which the Linux job deliberately excludes.
    runs-on: windows
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4

      - name: Show toolchain
        run: |
          dotnet --info
          git --version
          pwsh --version

      - name: Restore
        run: |
          dotnet restore CspPaletteCompanion.sln
          dotnet restore tools/CspPaletteCompanion.SmokeFixture/CspPaletteCompanion.SmokeFixture.csproj

      - name: Check shared suite files
        run: ./tools/suite-sync.ps1 -Mode Check

      - name: Check formatting
        run: dotnet format CspPaletteCompanion.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CspPaletteCompanion.sln -c Release --no-restore

      - name: Test
        run: dotnet test CspPaletteCompanion.sln -c Release --no-build --no-restore

      - name: Run smoke fixture
        run: |
          dotnet build tools/CspPaletteCompanion.SmokeFixture/CspPaletteCompanion.SmokeFixture.csproj `
            -c Release --no-restore
          dotnet run --project tools/CspPaletteCompanion.SmokeFixture/CspPaletteCompanion.SmokeFixture.csproj `
            -c Release --no-build --no-restore -- artifacts/ci-smoke
